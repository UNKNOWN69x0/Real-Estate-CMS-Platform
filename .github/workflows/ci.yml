name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch at a time; a newer push cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: API (lint, tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # The tests run against an in-memory MongoDB. Keep its binary outside node_modules (npm ci wipes that)
      # and cache it, so it is downloaded once instead of on every run.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/cache@v4
        with:
          path: .mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev

  client:
    name: Client (lint, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4 # the whole repo: a contract test reads the server's seed content
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
